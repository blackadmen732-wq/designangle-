# Every push and pull request: build every site, then run the checks that can
# be measured. Each exits non-zero on a failure, so a red run means a page
# would ship with a real problem: text that fails contrast, a target too small
# to tap, words cut off, a page that scrolls sideways, a section list or kind
# that is wrong, a shared value set in two places. The screenshots are kept
# as an artifact, because a pass is not the end: somebody still looks.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build every site
        run: node build.js

      - name: Section lists and kinds
        run: node tools/test-sections.js

      - name: One set of tokens
        run: node tools/tokens.js

      - name: Sites, owner panel and docs, at 400x860 and 1280x900
        run: node tools/check.js

      - name: App style, its styles, examples and recreations
        run: npm run check:app

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: .check/*.png
          retention-days: 14
          if-no-files-found: ignore
