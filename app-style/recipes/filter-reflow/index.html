<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="platform" content="desktop">
<title>Recipe: Filter and sort reflow</title>
<link rel="stylesheet" href="../recipes.css"></head>
<body><main>
<h1>Filter and sort reflow</h1><p class="why">Items move to their new places instead of jumping, so the eye can follow them.</p>
<div class="chips"><button id="odd">Only odd</button><button id="all">All</button><button id="rev">Reverse</button></div>
<ul class="grid" id="grid"><li data-n="1">1</li><li data-n="2">2</li><li data-n="3">3</li><li data-n="4">4</li><li data-n="5">5</li><li data-n="6">6</li><li data-n="7">7</li><li data-n="8">8</li><li data-n="9">9</li><li data-n="10">10</li><li data-n="11">11</li><li data-n="12">12</li></ul>
</main>
<script type="application/json" id="motion-tour">[{"click": "#rev", "why": "reverse: each moves to its new place"}, {"click": "#odd", "why": "filter: the rest close up"}]</script>
<script src="../../app-motion.js"></script>
<script src="../../interactions.js"></script>
<script>var g=document.getElementById('grid');function items(){return Array.from(g.children);}document.getElementById('odd').onclick=function(){Interact.reflow(g,function(){items().forEach(function(li){li.hidden=li.dataset.n%2===0;});});};document.getElementById('all').onclick=function(){Interact.reflow(g,function(){items().forEach(function(li){li.hidden=false;});});};document.getElementById('rev').onclick=function(){Interact.reflow(g,function(){items().reverse().forEach(function(li){g.appendChild(li);});});};</script>
</body></html>
