<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="platform" content="desktop">
<title>Recipe: Steps forward and back</title>
<link rel="stylesheet" href="../recipes.css"></head>
<body><main>
<h1>Steps forward and back</h1><p class="why">Next slides the new step in from the right; Back from the left, so direction says where you are.</p>
<div id="steps">
<section data-step><h2>1. Your details</h2><p>Name and email.</p><button class="primary" data-next>Next</button></section>
<section data-step><h2>2. Delivery</h2><p>Where and when.</p><button data-back>Back</button> <button class="primary" data-next>Next</button></section>
<section data-step><h2>3. Pay</h2><p>Card or wallet.</p><button data-back>Back</button></section></div>
</main>
<script type="application/json" id="motion-tour">[{"click": "#steps [data-step]:not([hidden]) [data-next]", "why": "forward: from the right"}, {"click": "#steps [data-step]:not([hidden]) [data-back]", "why": "back: from the left"}]</script>
<script src="../../app-motion.js"></script>
<script src="../../interactions.js"></script>
<script>Interact.steps(document.getElementById('steps'));</script>
</body></html>
