<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netflix Title Study</title>
<!-- A study of the Netflix redesign by uidesignmahsa, rebuilt from measured
     frames to prove the system reproduces it. Brand names belong to their
     owners; the photo is the kit's own free-licence stock. Not for shipping. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap">
<link rel="stylesheet" href="../app-style.css">
<link rel="stylesheet" href="../app-icons.css">
<style>
  body { margin: 0; }
  .nf-progress { position: absolute; z-index: 20; top: 55px; left: 16px; right: 16px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.22); }
  .nf-progress i { display: block; height: 100%; width: 73%; border-radius: 2px; background: #fff; }
  .nf-kicker { font-size: 15.5px; font-weight: 600; line-height: 1.3; }
  .nf-desc { font-size: 15.5px; line-height: 20px; color: var(--ink-2); }
  .nf-hint { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500; color: #989898; }
  .nf-hint .ic { --ic: 14px; }
</style>
</head>
<body>
<div class="ui ui-dark ui-phone" style="--accent:#e0231b">
  <div class="ui-status"><span>9:41</span><span class="ui-status-icons"><i class="ic ic-signal"></i><i class="ic ic-battery"></i></span></div>
  <div class="ui-island"></div>

  <div class="nf-progress" aria-label="Trailer progress"><i></i></div>
  <div class="topbar" style="top:69px">
    <button class="circle" aria-label="Close"><i class="ic ic-close"></i></button>
    <button class="circle" aria-label="Sound off"><i class="ic ic-mute"></i></button>
  </div>

  <div class="hero fade-top" style="position:absolute; top:112px; left:0; right:0; height:446px">
    <img src="../../sites/hvac/img/repair.webp" alt="">
  </div>

  <div class="pad" style="position:absolute; left:0; right:0; top:541.5px">
    <p class="nf-kicker accent">Netflix series</p>
  </div>
  <h1 class="t-display" style="position:absolute; left:16px; top:568px; font-size:44px">Black Mirror</h1>
  <div class="tags" style="position:absolute; left:16px; top:629px">
    <span class="tag">TV MA</span><span class="tag">HD</span>
    <span class="tag"><i class="ic ic-cc"></i>Subtitles</span><span class="tag">Audio description</span>
  </div>
  <p class="nf-desc" style="position:absolute; left:16px; right:16px; top:664.5px">
    Dystopian tales about the dark side of tech.<br>Season 7 opens with Common People.
  </p>
  <div class="actions" style="position:absolute; left:16px; right:16px; top:721px">
    <button class="pill"><i class="ic ic-play" style="--ic:21px"></i>Play <span class="sub">S7 Episode 1</span></button>
    <button class="circle lg" aria-label="Download"><i class="ic ic-download"></i></button>
    <button class="circle lg" aria-label="Add to my list"><i class="ic ic-plus"></i></button>
  </div>
  <p class="nf-hint" style="position:absolute; left:0; right:0; top:793px"><i class="ic ic-chev-up"></i>Swipe up for episodes and more</p>

  <div class="ui-home-bar"></div>
</div>
</body>
</html>
